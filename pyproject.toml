[project]
name = "yoda-viewer"
version = "0.1.0"
description = "YoDa - A YOLO Dataset visualizer built with NiceGUI"
authors = [{ name = "Phil Lies", email = "phil@lies.io" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "nicegui>=3.7.1",
    "pillow>=12.1.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
    "typer>=0.21.1",
]
license = "MIT"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "B", "I", "Q", "S", "T"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-playwright>=0.7.0",
    "playwright>=1.50.0",
]

[project.scripts]
yoda = "yoda.main:cli_main"
